<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ForzaDashboard Overlay</title>
<style>
/* In-Game-Overlay: frei angeordnete Glas-Widgets über Forza. ?edit=1 = Anpassen in den Einstellungen (Beispielbild statt Spiel). */
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font:13px/1.25 "SF Pro Display",-apple-system,"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
body.edit{background:#16181d}
.edit #stage{bottom:auto;background:#0b0d12 url(/overlay/vorschau.jpg) center/100% 100% no-repeat;overflow:hidden}
#stage{position:absolute;inset:0;opacity:0;transition:opacity .5s}
#stage.on{opacity:1}
.wd{position:absolute;left:0;top:0;transform-origin:0 0;--o:1}
.card{position:absolute;inset:0;border-radius:28px;overflow:hidden;
  background:linear-gradient(160deg,rgba(66,70,82,calc(.80*var(--o))) 0%,rgba(30,32,40,calc(.84*var(--o))) 55%,rgba(18,19,24,calc(.88*var(--o))) 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,calc(.14*var(--o) + .04)),inset 0 1px 0 rgba(255,255,255,calc(.26*var(--o) + .04))}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 0% 0%,rgba(255,255,255,calc(.10*var(--o))),transparent 60%);pointer-events:none}
.pad{position:absolute;inset:12px}
.map{position:relative;border-radius:20px;overflow:hidden;background:rgba(16,20,25,calc(.55 + .45*var(--o)));box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);height:100%}
.map canvas{position:absolute;inset:0;width:100%;height:100%}
.map::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 18px rgba(0,0,0,.45);pointer-events:none}
.bub{position:absolute;left:9px;bottom:9px;min-width:44px;height:44px;border-radius:22px;background:rgba(20,22,28,.78);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 6px}
.bub b{font-size:17px;font-weight:700;line-height:1;letter-spacing:-.02em}
.bub small{font-size:8.5px;color:rgba(255,255,255,.6);font-weight:600}
.row{display:flex;align-items:center;gap:11px;min-width:0}
.ico{width:46px;height:46px;border-radius:14px;background:var(--acc,#0a84ff);display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.ico svg{width:28px;height:28px}
.ico.g{background:rgba(255,255,255,.12)}
.tt{min-width:0;flex:1}
.tt b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt small{display:block;font-size:12.5px;color:rgba(255,255,255,.66);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tt.s b{font-size:14px;font-weight:650;letter-spacing:0}
.tt.s small{font-size:11.5px;margin-top:1px}
.art{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#fa5c7c,#7d5cff);flex:none;display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.art svg{width:17px;height:17px}
.sep{height:1px;background:rgba(255,255,255,.1);margin:12px 0 10px}
.stats{display:flex;gap:6px}
.st{flex:1;background:rgba(255,255,255,.08);border-radius:12px;padding:5px 9px;min-width:0}
.st small{display:block;font-size:9.5px;color:rgba(255,255,255,.55);font-weight:600}
.st b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats.n4 .st{padding:5px 7px}
.stats.n4 .st b{font-size:12.5px}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
.big b{font-size:52px;font-weight:700;letter-spacing:-.04em;line-height:1}
.big small{font-size:12px;color:rgba(255,255,255,.6);font-weight:600;margin-top:3px}
.big i{position:absolute;right:14px;top:12px;font-style:normal;font-size:16px;font-weight:700;color:rgba(255,255,255,.8)}
.lbl{font-size:11px;color:rgba(255,255,255,.55);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.val{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.fbar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:7px}
.fbar u{display:block;height:100%;background:#30d158;border-radius:3px;transition:width .5s}
.dots{position:absolute;right:12px;top:50%;translate:0 -50%;display:flex;flex-direction:column;gap:4px}
.dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.3)}
.dots i.on{background:#fff}
.blk{position:absolute;left:8px;right:8px;top:8px;display:flex;justify-content:space-between;pointer-events:none;z-index:2}
.blk i{width:30px;height:30px;border-radius:10px;background:rgba(20,22,28,.7);display:grid;place-items:center;color:rgba(255,255,255,.18);opacity:0;transition:opacity .2s}
.blk i svg{width:20px;height:20px}
.blk i.on{opacity:1;animation:blk .9s steps(1) infinite}
@keyframes blk{0%{color:#30d158;filter:drop-shadow(0 0 6px rgba(48,209,88,.9))}50%{color:rgba(255,255,255,.2);filter:none}}
.blw{display:flex;align-items:center;justify-content:space-between;height:100%;padding:0 6px}
.blw i{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;color:rgba(255,255,255,.16);background:rgba(255,255,255,.05)}
.blw i svg{width:34px;height:34px}
.blw i.on{animation:blk .9s steps(1) infinite}
/* Kombi: Karte + frei gewählte Apps, Abstände verteilen sich von selbst */
.cmb{display:flex;gap:14px}
.cmb.r{flex-direction:row-reverse}
.cmb .map{flex:none}
.col{flex:1;min-width:0;display:flex;flex-direction:column;padding:4px 4px 2px 0}
.cmb.r .col{padding:4px 0 2px 4px}
.col.one{justify-content:center}
.col .gp{flex:1 1 0;min-height:21px;position:relative}
.col .gp::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.1)}
.mi{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.mi svg{width:18px;height:18px}
.mod .fbar{margin-top:6px}
.spd{display:flex;align-items:center;gap:10px}
.spd b{font-size:34px;font-weight:700;letter-spacing:-.04em;line-height:1}
.spd small{font-size:11px;color:rgba(255,255,255,.6);font-weight:650;margin-top:10px}
.spd .gch{margin-left:auto;min-width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:17px;font-weight:700}
.blr{display:flex;justify-content:space-between;gap:10px}
.blr i{flex:1;height:34px;border-radius:11px;display:grid;place-items:center;color:rgba(255,255,255,.16);background:rgba(255,255,255,.06)}
.blr i svg{width:22px;height:22px}
.blr i.on{animation:blk .9s steps(1) infinite}
.fade{animation:fd .45s ease}
/* Hinweis oben: Event startet / Level erreicht */
#note{position:absolute;left:50%;top:0;transform-origin:50% 0;z-index:6;pointer-events:none}
#note .ahc{position:relative;inset:auto;display:flex;align-items:center;gap:12px;padding:8px 22px 8px 8px;border-radius:32px;white-space:nowrap}
#note .ni{width:42px;height:42px;border-radius:21px;display:grid;place-items:center;background:#0a84ff;color:#fff;font-weight:750;font-size:17px;flex:none}
#note .ni svg{width:20px;height:20px}
#note b{display:block;font-size:16px;font-weight:700}
#note small{display:block;font-size:12.5px;color:rgba(255,255,255,.65);margin-top:1px}
#note.hid{opacity:0}
/* PC-Leistung */
.pcw{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;height:100%;align-content:center}
.pcr{display:flex;flex-direction:column;gap:5px;min-width:0}
.pcr div{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.pcr small{font-size:10.5px;color:rgba(255,255,255,.55);font-weight:700;letter-spacing:.04em}
.pcr b{font-size:15px;font-weight:700;white-space:nowrap}
.pcr i{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.pcr u{display:block;height:100%;width:0;border-radius:3px;background:#30d158;transition:width .6s,background .6s}
/* Kontrollleuchten: dezent grau, leuchten nur bei Bedarf */
.lmp{display:flex;align-items:center;gap:13px}
.lmp i{display:grid;place-items:center;color:rgba(255,255,255,.17);transition:color .25s,filter .25s}
.lmp svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.lmp i.g{color:#30d158;filter:drop-shadow(0 0 4px rgba(48,209,88,.8))}
.lmp i.y{color:#ffd60a;filter:drop-shadow(0 0 4px rgba(255,214,10,.75))}
.lmp i.r{color:#ff453a;filter:drop-shadow(0 0 5px rgba(255,69,58,.85))}
.lmp i.o{animation:lmpb .5s steps(1) infinite}
@keyframes lmpb{0%{color:#ff9f0a;filter:drop-shadow(0 0 5px rgba(255,159,10,.9))}50%{color:rgba(255,255,255,.17);filter:none}}
.cmbl{position:absolute;bottom:9px;height:30px;justify-content:space-around}
.cmbl svg{width:22px;height:22px;stroke-width:2}
/* Kontrollleuchten als eigenes Widget: größer, Hintergrund abschaltbar */
.wd.nobg > .card{display:none}
.wd.nobg .lmp i[class=""],.wd.nobg .lmp i:not([class]){color:rgba(255,255,255,.42);filter:drop-shadow(0 1px 3px rgba(0,0,0,.95))}
.edit .wd.nobg{outline:1px dashed rgba(255,255,255,.25);outline-offset:2px;border-radius:14px}
.lmw{justify-content:space-around;height:100%;padding:0 10px}
.lmw svg{width:26px;height:26px;stroke-width:2}
/* Widget „Blinker vor dir“: Blase, die auftaucht und beim Verschwinden zerplatzt */
.wd{transition:opacity .35s}
.wd.hid{opacity:0}
.wd[data-t="ahead"] > .card{display:none}
.ahb{position:absolute;inset:0}
.ahc{position:absolute;inset:0;border-radius:32px;display:flex;align-items:center;gap:12px;padding:0 10px;
  background:rgba(12,12,14,calc(.5 + .4*var(--o)));-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.13),inset 0 1px 0 rgba(255,255,255,.18),0 10px 28px rgba(0,0,0,.35)}
.ahc .av{position:relative;width:44px;height:44px;border-radius:22px;display:grid;place-items:center;font-size:18px;font-weight:750;color:#fff;background:var(--fc,#5e5ce6);flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.ahc .tt{flex:1;position:relative}
.ahc .tt b{font-size:16px}
.ahc .ai{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;flex:none;color:rgba(255,255,255,.12);background:rgba(255,255,255,.04);transition:color .2s,background .2s}
.ahc .ai svg{width:24px;height:24px}
.ahc .ai.on{animation:ahb .9s steps(1) infinite}
.ahc::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0}
.ahb[data-side="l"] .ahc::before{background:linear-gradient(90deg,rgba(10,132,255,.42),rgba(10,132,255,0) 38%);animation:edge .9s steps(1) infinite}
.ahb[data-side="r"] .ahc::before{background:linear-gradient(270deg,rgba(10,132,255,.42),rgba(10,132,255,0) 38%);animation:edge .9s steps(1) infinite}
.ahb[data-side="h"] .ahc::before{background:linear-gradient(90deg,rgba(10,132,255,.38),rgba(10,132,255,0) 30%,rgba(10,132,255,0) 70%,rgba(10,132,255,.38));animation:edge .9s steps(1) infinite}
@keyframes edge{0%{opacity:1}50%{opacity:0}}
@keyframes ahb{0%{color:#0a84ff;background:rgba(10,132,255,.28);filter:drop-shadow(0 0 7px rgba(10,132,255,.95))}50%{color:rgba(10,132,255,.3);background:rgba(10,132,255,.1);filter:none}}
.ahb.in .ahc{animation:bIn .62s cubic-bezier(.22,1.35,.4,1) both}
.ahb.in .ahc > *{animation:cIn .38s .16s ease-out both}
@keyframes bIn{0%{transform:scale(.25,.55);opacity:0;filter:blur(8px)}55%{opacity:1;filter:blur(0)}100%{transform:none}}
@keyframes cIn{from{opacity:0;transform:translateY(5px) scale(.96)}}
.ahb.pop .ahc{animation:bPop .4s cubic-bezier(.3,0,.5,1) forwards}
@keyframes bPop{0%{transform:none;opacity:1}30%{transform:scale(1.07);opacity:1;filter:blur(0)}100%{transform:scale(1.28);opacity:0;filter:blur(10px)}}
.ahb::after{content:"";position:absolute;inset:0;border-radius:32px;box-shadow:0 0 0 2px rgba(255,255,255,.55);opacity:0;pointer-events:none}
.ahb.pop::after{animation:ring .45s ease-out forwards}
@keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}
.ahb u{position:absolute;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.9);opacity:0;pointer-events:none;transform:translate(-50%,-50%)}
.ahb u:nth-child(even){background:#5ac8fa;width:5px;height:5px}
.ahb.pop u{animation:drop .5s .06s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes drop{0%{opacity:0;transform:translate(-50%,-50%) scale(1)}20%{opacity:.95}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2)}}
@keyframes fd{from{opacity:0;transform:translateY(4px)}}
/* Anpassen */
.edit .wd{cursor:grab}
.edit .wd.sel{outline:2px solid #0a84ff;outline-offset:4px;border-radius:30px}
.rs{position:absolute;right:-12px;bottom:-12px;width:22px;height:22px;border-radius:50%;background:#0a84ff;border:2px solid #fff;display:none;cursor:nwse-resize;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.edit .wd.sel .rs{display:block}
#bar{position:absolute;left:50%;top:14px;translate:-50% 0;width:max-content;display:none;align-items:center;gap:8px;background:rgba(24,26,32,.92);border-radius:22px;padding:7px 8px;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.1);z-index:10;max-width:calc(100% - 28px);flex-wrap:wrap;justify-content:center}
.edit #bar{display:flex}
#bar button{font:inherit;font-weight:650;font-size:13px;border:0;border-radius:15px;height:30px;padding:0 12px;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;white-space:nowrap}
#bar button.pri{background:#0a84ff}
#bar button.dang{color:#ff6961}
#bar button.ok{background:#fff;color:#111}
#bar label{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.75);font-weight:600;padding:0 4px}
#bar input[type=range]{width:96px;accent-color:#0a84ff}
#bar .sx{width:1px;height:20px;background:rgba(255,255,255,.15)}
#menu{position:absolute;left:50%;top:50%;translate:-50% -50%;display:none;flex-direction:column;width:600px;max-width:calc(100% - 28px);box-sizing:border-box;
  background:rgba(30,31,36,.86);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);border-radius:28px;padding:18px 20px 20px;
  box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.1);z-index:11;overflow:auto;animation:mIn .28s cubic-bezier(.2,.9,.3,1.15)}
@keyframes mIn{from{opacity:0;scale:.94}}
#menu.on{display:flex}
#mbg{position:absolute;left:0;top:0;right:0;display:none;background:rgba(0,0,0,.38);z-index:10}
#menu.on ~ #mbg{display:block}
#menu .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
#menu .mh b{font-size:22px;font-weight:750;letter-spacing:-.02em}
#menu .mh button{width:30px;height:30px;border-radius:15px;border:0;background:rgba(255,255,255,.12);color:rgba(255,255,255,.8);font-size:15px;cursor:pointer;display:grid;place-items:center}
#menu .ms{font-size:12.5px;color:rgba(255,255,255,.55);margin-bottom:6px}
#menu .mg{font-size:12px;font-weight:650;color:rgba(255,255,255,.5);margin:10px 4px 6px}
#menu .mt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
#menu .mt button{font:inherit;border:0;border-radius:16px;background:rgba(255,255,255,.07);color:#fff;padding:10px 11px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;min-width:0;transition:background .15s,scale .15s}
.chn{inset:10px 14px;display:flex;flex-direction:column;gap:6px}
.cht{display:flex;justify-content:space-between;align-items:center}
.cht>b{font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cht span{text-align:right}.cht small{display:block;font-size:10px;color:rgba(255,255,255,.55);font-weight:600}.cht span b{font-size:15px}
.chb{height:5px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}.chb i{display:block;height:100%;width:0;transition:width .3s}
.chc div{display:flex;justify-content:space-between;font-size:11.5px;color:rgba(255,255,255,.7)}
.chc .bank b{color:#30d158}.chc .brk span,.chc .brk b{color:#ff453a}.chc .up b{color:#bf5af2}
.chn.brk{animation:chbr .25s steps(1) 4}@keyframes chbr{0%{opacity:1}50%{opacity:.35}}
#menu .mt button .dupb{display:block;font-style:normal;font-size:11px;font-weight:600;color:#ff9f0a;margin-top:2px}
#ovwarn{position:fixed;left:50%;top:70px;translate:-50% -8px;z-index:99;padding:10px 16px;border-radius:14px;background:rgba(255,159,10,.95);color:#1c1c1e;font:600 14px/1.3 -apple-system,"Segoe UI",sans-serif;opacity:0;pointer-events:none;transition:opacity .25s,translate .25s;max-width:80vw;text-align:center}
#ovwarn.on{opacity:1;translate:-50% 0}
#menu .mt button:hover{background:rgba(255,255,255,.13)}
#menu .mt button:active{scale:.97}
#menu .mt i{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
#menu .mt i svg{width:21px;height:21px}
#menu .mt span{min-width:0}
#menu .mt b{font-size:13px;font-weight:650;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menu .mt small{font-size:11px;color:rgba(255,255,255,.55);display:block;margin-top:1px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chips{display:none;gap:5px;flex-wrap:wrap}
#chips button{height:26px;padding:0 10px;font-size:12px;background:rgba(255,255,255,.08)}
#chips button.on{background:#fff;color:#111}
/* Kombi gestalten */
#cmbp{position:absolute;left:12px;top:12px;width:300px;display:none;flex-direction:column;background:rgba(28,28,30,.97);border-radius:22px;padding:0 0 14px;
  box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.08);z-index:11;overflow:auto;box-sizing:border-box;animation:shIn .25s cubic-bezier(.2,.9,.3,1.1)}
@keyframes shIn{from{opacity:0;transform:translateX(-10px)}}
#cmbp.on{display:flex}
#cmbp::-webkit-scrollbar{width:0}
#cmbp .shd{position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;background:rgba(28,28,30,.97)}
#cmbp .shd b{font-size:17px;font-weight:700}
#cmbp .shd button{border:0;background:none;color:#0a84ff;font:inherit;font-size:15px;font-weight:650;cursor:pointer;padding:4px}
#cmbp .gh{font-size:12px;color:rgba(235,235,245,.55);text-transform:uppercase;letter-spacing:.04em;padding:14px 28px 6px;display:flex;justify-content:space-between}
#cmbp .gh small{font-size:12px;text-transform:none;letter-spacing:0}
#cmbp .gf{font-size:12px;color:rgba(235,235,245,.45);padding:7px 28px 0;line-height:1.35}
#cmbp .grp{margin:0 12px;background:#2c2c2e;border-radius:12px;position:relative}
#cmbp .r2{display:flex;align-items:center;gap:11px;min-height:42px;padding:0 12px;position:relative;font:inherit;font-size:14px;color:#fff;background:#2c2c2e;border:0;width:100%;box-sizing:border-box;text-align:left;border-radius:12px;transition:transform .2s cubic-bezier(.2,.8,.3,1)}
#cmbp .r2 + .r2::before{content:"";position:absolute;left:45px;right:0;top:0;height:1px;background:rgba(84,84,88,.55)}
#cmbp .r2.plain + .r2::before,#cmbp .r2.plain::before{left:12px}
#cmbp .r2 > span.hd{flex:none}
#cmbp .r2 > span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cmbp .r2.cat{cursor:pointer;font-weight:650}

    if (b.dataset.fold) { const id = b.dataset.fold; if (ADDOPEN.has(id)) ADDOPEN.delete(id); else ADDOPEN.add(id); cmbRender(); return; }
    if (b.dataset.k && cur() && cur().t === "lamps") { const w = cur(); w.cfg = Object.assign({}, w.cfg || {}, {[b.dataset.k]:b.dataset.v}); build(); sync(); cmbRender(); save(); }
    else if (b.dataset.k) cmbSet(c => { c[b.dataset.k] = b.dataset.v; });
    else if (b.dataset.rm) { const [key, k] = b.dataset.rm.split(":"); setList(key, a => { const i = a.indexOf(k); if (i >= 0) a.splice(i, 1); }); }
    else if (b.dataset.add) { const [key, k] = b.dataset.add.split(":"); setList(key, a => { if (a.length < MAXOF[key] && !a.includes(k)) a.push(k); }); }
    else if (b.dataset.acc) { const w = cur(); if (!w) return; w.acc = b.dataset.acc; build(); sync(); cmbRender(); save(); }
  });
  addEventListener("keydown", e => { if ((e.key === "Delete" || e.key === "Backspace") && sel) { L.w = L.w.filter(x => x.id !== sel); sel = null; build(); sync(); save(); } });
  sync();
}
</script></body></html>
