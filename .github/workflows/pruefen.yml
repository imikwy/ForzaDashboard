# Bei jedem Push: Programm bauen und testen, Karte prüfen.
name: Prüfen
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  programm:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Tests
        run: cargo test --manifest-path app/Cargo.toml
  karte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Karte prüfen
        run: node tools/karte.js pruefen
