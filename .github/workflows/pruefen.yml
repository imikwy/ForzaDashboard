# Bei jedem Push und Pull Request: Tests + Kartenprüfung (inkl. Schutz gegen Massenlöschung)
name: Prüfen
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test "test/*.test.js"
      - name: Karte prüfen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '[.[].tagName | select(startswith("karte-v")) | ltrimstr("karte-v") | tonumber] | max // empty')
          if [ -n "$prev" ]; then
            gh release download "karte-v$prev" --repo "$GITHUB_REPOSITORY" --pattern karte.json.gz --dir /tmp/vorher
            extra=""
            if git log -1 --pretty=%B | grep -q "\[massenloeschung-ok\]"; then extra="--massenloeschung-ok"; fi
            node tools/karte.js pruefen --vorher /tmp/vorher/karte.json.gz $extra
          else
            node tools/karte.js pruefen
          fi
